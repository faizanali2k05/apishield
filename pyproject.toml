[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apishield"
version = "0.1.0"
description = "Small safe outbound URL, header, and body policies for Python clients"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Faizan Ali" }]
keywords = ["http", "security", "ssrf", "validation", "api"]
classifiers = ["Development Status :: 3 - Alpha", "Intended Audience :: Developers", "License :: OSI Approved :: MIT License", "Programming Language :: Python :: 3", "Programming Language :: Python :: 3.11", "Programming Language :: Python :: 3.12", "Programming Language :: Python :: 3.13", "Typing :: Typed"]

[project.urls]
Homepage = "https://github.com/faizanali2k05/apishield"
Repository = "https://github.com/faizanali2k05/apishield"
Issues = "https://github.com/faizanali2k05/apishield/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/apishield"]
